<main class="content center">
  <h2>Enter the code</h2>
  <form id="otp-form" class="center">
    <p class="instructions">
      Enter the 6-digit code sent to <strong id="pending-email">{{email}}</strong>.
      <strong>This demo doesn't send any email, so any 6 digits work.</strong>
    </p>

    <mdui-text-field
      type="text"
      id="otp"
      name="otp"
      inputmode="numeric"
      autocomplete="one-time-code"
      pattern="[0-9]{6}"
      maxlength="6"
      label="One-time code"
      variant="outlined"
      required
      autofocus
    >
    </mdui-text-field>

    <mdui-button type="submit" variant="filled" id="otp-submit-btn">Verify code</mdui-button>
    <mdui-button href="/evp" variant="text">Cancel</mdui-button>
  </form>
</main>
